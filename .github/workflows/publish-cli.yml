name: Publish CLI

on:
  push:
    tags:
      - "frontier-fe@*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Install CLI dependencies
        run: npm ci --prefix packages/cli

      - name: Validate source and templates
        run: npm run lint && npm run type-check && npm run test:coverage && npm run test:showcase:coverage && npm run build && npm run build:showcase && npm run sync:templates:check && npm run check:registry

      - name: Build and smoke-test CLI
        run: npm run cli:build && npm run smoke:cli

      - name: Verify Docker deployments
        run: npm run smoke:docker

      - name: Publish
        working-directory: packages/cli
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
