name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:run && npm run test:showcase

      - name: Coverage check
        run: npm run test:coverage && npm run test:showcase:coverage

      - name: Build
        run: npm run build && npm run build:showcase

      - name: Install CLI dependencies
        run: npm ci --prefix packages/cli

      - name: Check templates and registry
        run: npm run sync:templates:check && npm run check:registry

      - name: Build and smoke-test CLI
        run: npm run cli:build && npm run smoke:cli

      - name: Verify Docker deployments
        run: npm run smoke:docker

      - name: Security audit
        run: npm audit --audit-level=high
